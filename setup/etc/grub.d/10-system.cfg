# ==============================================================================
# CONFIGURACIÓN BASE DEL SISTEMA PARA GRUB (DROP-IN MODULAR)
# ==============================================================================
# Este archivo define las políticas globales de arranque sin tocar /etc/default/grub
# ==============================================================================

GRUB_DEFAULT=0
GRUB_TIMEOUT=2
GRUB_TIMEOUT_STYLE=menu
GRUB_DISTRIBUTOR="Debian"
GRUB_DISABLE_OS_PROBER=true
GRUB_DISABLE_RECOVERY=true
GRUB_CMDLINE_LINUX_DEFAULT="quiet loglevel=2 systemd.show_status=false rd.udev.log_priority=3 vt.global_cursor_default=0 nowatchdog"
GRUB_CMDLINE_LINUX=""
