# ==============================================================================
# CONFIGURACIÓN MODULAR DEL TEMA VISUAL DE GRUB (APPLE MACOS DARK - 1080P)
# ==============================================================================
# - Mantiene el menú de selección visible (sin ocultar kernels ni opciones)
# - Renderizado a resolución nativa 1080p con tipografía nítida
# - 0 MB de consumo de RAM al iniciar Linux
# ==============================================================================

GRUB_THEME="/boot/grub/themes/apple-dark/theme.txt"
GRUB_FONT="/boot/grub/themes/apple-dark/font.pf2"
GRUB_GFXMODE="1920x1080,auto"
GRUB_BACKGROUND=""
GRUB_TIMEOUT=5
GRUB_TIMEOUT_STYLE=menu
GRUB_DISABLE_RECOVERY="false"
