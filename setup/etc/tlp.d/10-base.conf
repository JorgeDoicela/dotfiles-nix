# ==============================================================================
# /etc/tlp.d/10-base.conf - Política Universal de Energía para Laptops (TLP)
# ==============================================================================
# Aplicable a cualquier equipo (Intel / AMD, Debian / Arch).
# Los ajustes específicos de hardware o perfiles silenciosos se sobreescriben
# mediante drop-ins /etc/tlp.d/99-<hostname>.conf.

# --- Radios al inicio ---
RESTORE_DEVICE_STATE_ON_STARTUP=0
DEVICES_TO_DISABLE_ON_STARTUP="bluetooth"

# --- CPU: Equilibrio estándar (máxima potencia en AC, eficiencia en batería) ---
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=60

# --- Almacenamiento SATA / AHCI ---
SATA_LINKPWR_ON_AC=med_power_with_dipm
SATA_LINKPWR_ON_BAT=med_power_with_dipm
AHCI_RUNTIME_PM_ON_AC=on
AHCI_RUNTIME_PM_ON_BAT=auto
AHCI_RUNTIME_PM_TIMEOUT=15

# --- PCIe Runtime PM y ASPM (seguros para controladores Wi-Fi QCA9377 y Radeon) ---
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=default
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto
RUNTIME_PM_DRIVER_DENYLIST="mei_me nouveau radeon xhci_hcd ath10k_pci"

# --- Red y Wi-Fi ---
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=off
WOL_DISABLE=Y

# --- Audio y USB ---
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y
USB_AUTOSUSPEND=1
USB_EXCLUDE_AUDIO=1
USB_EXCLUDE_BTUSB=1
USB_EXCLUDE_PHONE=0
USB_EXCLUDE_PRINTER=1

# --- Suspensión y salud de batería ---
MEM_SLEEP_ON_AC=s2idle
MEM_SLEEP_ON_BAT=deep
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80
RESTORE_THRESHOLDS_ON_BAT=1

# --- Kernel ---
NMI_WATCHDOG=0
