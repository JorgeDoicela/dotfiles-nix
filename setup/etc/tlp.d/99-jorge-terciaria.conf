# ==============================================================================
# /etc/tlp.d/99-jorge-terciaria.conf - Perfil Térmico Silencioso (Dell 5570)
# ==============================================================================
# Hardware: Intel Core i7-8550U | Intel UHD 620 + AMD Radeon R7 M360
#           SSD (/): ata-SSSTC_CVB-8D128-HP_UKCVC01ZTE91BK
#           HDD (/home): ata-TOSHIBA_MQ01ABD100_Z6T5S9JOS
# Rol: Lectura, estudio y multimedia (bajas temperaturas, ventilador 0 RPM)

# --- CPU: Sin Turbo Boost ni picos térmicos en AC ni en BAT ---
CPU_DRIVER_OPMODE_ON_AC=active
CPU_DRIVER_OPMODE_ON_BAT=active
CPU_ENERGY_PERF_POLICY_ON_AC=balance_power
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_BOOST_ON_AC=0
CPU_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_AC=0
CPU_HWP_DYN_BOOST_ON_BAT=0
CPU_MAX_PERF_ON_AC=70
CPU_MAX_PERF_ON_BAT=55

# --- iGPU Intel UHD 620: acotar cola superior ineficiente (300-1150 MHz) ---
INTEL_GPU_MIN_FREQ_ON_AC=300
INTEL_GPU_MAX_FREQ_ON_AC=850
INTEL_GPU_BOOST_FREQ_ON_AC=850
INTEL_GPU_MIN_FREQ_ON_BAT=300
INTEL_GPU_MAX_FREQ_ON_BAT=600
INTEL_GPU_BOOST_FREQ_ON_BAT=600

# --- dGPU AMD Radeon R7 M360 y Runtime PM en AC ---
RADEON_DPM_PERF_LEVEL_ON_AC=low
RADEON_DPM_PERF_LEVEL_ON_BAT=low
RADEON_DPM_STATE_ON_AC=battery
RADEON_DPM_STATE_ON_BAT=battery
RUNTIME_PM_ON_AC=auto
# Mantener puertos AHCI activos en AC y BAT para evitar pausas de 3-5s al despertar sda/sdb
AHCI_RUNTIME_PM_ON_AC=on
AHCI_RUNTIME_PM_ON_BAT=on

# --- Discos por ID persistente (sin spin-down agresivo en el HDD /home) ---
DISK_DEVICES="ata-SSSTC_CVB-8D128-HP_UKCVC01ZTE91BK ata-TOSHIBA_MQ01ABD100_Z6T5S9JOS"
DISK_APM_LEVEL_ON_AC="254 254"
DISK_APM_LEVEL_ON_BAT="254 192"
DISK_IOSCHED="mq-deadline mq-deadline"
DISK_SPINDOWN_TIMEOUT_ON_AC="0 0"
DISK_SPINDOWN_TIMEOUT_ON_BAT="0 0"
