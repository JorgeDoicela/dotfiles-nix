# ==============================================================================
# /etc/tlp.conf - Configuración Base Limpia (Arquitectura Drop-In)
# ==============================================================================
# Todas las políticas energéticas residen de forma modular en /etc/tlp.d/:
#   - 10-base.conf           : Política universal segura para cualquier laptop
#   - 99-<hostname>.conf     : Perfil térmico y de hardware específico del host
#
# Mantener este archivo sin parámetros activos garantiza que /etc/tlp.d/*.conf
# tenga precedencia real y evita conflictos con dpkg en actualizaciones de TLP.
