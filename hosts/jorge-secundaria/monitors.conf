# ==============================================================================
# CONFIGURACIÓN DE MONITORES - JORGE-SECUNDARIA (Dual Monitor)
# ==============================================================================
# Monitor Externo en la Izquierda (0x0)
monitor = HDMI-A-1, 1920x1080@60, 0x0, 1
monitor = DP-1, 1920x1080@60, 0x0, 1

# Pantalla de la Laptop en la Derecha (1920x0)
monitor = eDP-1, 1920x1080@60, 1920x0, 1

# Regla de fallback automático para cualquier otro monitor conectado
monitor = , preferred, auto, 1

# Asignación de Workspaces por Pantalla:
# Workspaces 1 al 5 asignados al Monitor Externo (Principal / Izquierda)
workspace = 1, monitor:HDMI-A-1, default:true
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1

# Workspaces 6 al 10 asignados a la Pantalla de la Laptop (Secundaria / Derecha)
workspace = 6, monitor:eDP-1, default:true
workspace = 7, monitor:eDP-1
workspace = 8, monitor:eDP-1
workspace = 9, monitor:eDP-1
workspace = 10, monitor:eDP-1
