# ==============================================================================
# CONFIGURACIÓN DE MONITORES - JORGE-SECUNDARIA (Dual Monitor)
# ==============================================================================
# 1. Monitor Externo (HDMI-A-1) - A la izquierda
monitor = HDMI-A-1, 1366x768@60, 0x0, 1
monitor = DP-1, 1366x768@60, 0x0, 1

# 2. Pantalla de la Laptop (eDP-1) - A la derecha
monitor = eDP-1, 1366x768@60, 1366x0, 1

# 3. Margen para franja dañada de la pantalla (eDP-1)
monitor = eDP-1, addreserved, 0, 0, 228, 0

# Regla de fallback automático para cualquier otro monitor conectado
monitor = , preferred, auto, 1

# Asignación de Workspaces por Pantalla (Esquema Intercalado):
# Pantalla de la Laptop (eDP-1 - Derecha / Principal): 1, 2, 5, 6, 9, 10
workspace = 1, monitor:eDP-1, default:true
workspace = 2, monitor:eDP-1
workspace = 5, monitor:eDP-1
workspace = 6, monitor:eDP-1
workspace = 9, monitor:eDP-1
workspace = 10, monitor:eDP-1

# Monitor Externo (HDMI-A-1 - Izquierda / Secundario): 3, 4, 7, 8
workspace = 3, monitor:HDMI-A-1, default:true
workspace = 4, monitor:HDMI-A-1
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
