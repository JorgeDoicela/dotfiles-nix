# Configuración Monocromática Blanco / Gris Espacial para Starship
add_newline = false

format = """
[\ue0b6](fg:#2c2c2e)\
[$os](bg:#2c2c2e)\
[\ue0b4](fg:#2c2c2e bg:#1c1c1e)\
[$directory](bg:#1c1c1e)\
[\ue0b4](fg:#1c1c1e)\
 \
$git_branch\
$git_status\
$kubernetes\
$nodejs\
$rust\
$python\
$cmd_duration\
$line_break\
$character"""

[os]
disabled = false
style = "bg:#2c2c2e fg:#ffffff bold"
format = "[ $symbol ]($style)"

[os.symbols]
Debian = "\uf306"

[directory]
style = "bg:#1c1c1e fg:#ffffff bold"
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " \U000f033e"

[git_branch]
symbol = "\uf126 "
style = "bold #e5e5ea"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold #ff453a"
format = "[$all_status$ahead_behind]($style) "

[kubernetes]
symbol = "\u2638 "
style = "bold #e5e5ea"
format = 'at [$symbol$context(\($namespace\))]($style) '
disabled = false
detect_files = ['*.yaml', 'Dockerfile', 'docker-compose.yml', 'helmfile.yaml']
detect_folders = ['k8s', 'helm', 'kubernetes', 'manifests', 'charts']

[nodejs]
symbol = "\ued13 "
style = "bold #e5e5ea"
format = "via [$symbol($version)]($style) "

[rust]
symbol = "\ue7a8 "
style = "bold #e5e5ea"
format = "via [$symbol($version)]($style) "

[python]
symbol = "\uf81f "
style = "bold #e5e5ea"
format = "via [$symbol($version)]($style) "

[cmd_duration]
min_time = 500
style = "bold #8e8e93"
format = "took [$duration]($style) "

[character]
success_symbol = "[\U000f0627](bold white) "
error_symbol = "[\U000f0627](bold #ff453a) "
