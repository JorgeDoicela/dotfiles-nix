# // █░░ █▀▀ █▀█ █▀▄▀█ █▀█ █▀
# // █▄▄ ██▄ █▀▄ █░▀░█ █▀█ ▄█
# Configuración Principal de Hyprland (Directa, Independiente y Profesional)

# ── 1. Monitores ──────────────────────────────────────────────────────
source = ~/.config/hypr/monitors.conf

# ── 2. Variables de Entorno ───────────────────────────────────────────
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = PATH,$HOME/.local/bin:$PATH
env = XDG_CONFIG_HOME,$HOME/.config
env = XDG_CACHE_HOME,$HOME/.cache
env = XDG_DATA_HOME,$HOME/.local/share
env = XDG_STATE_HOME,$HOME/.local/state

# Temas y toolkit backends
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt6ct
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ── 3. Autostart (Servicios de Inicio) ────────────────────────────────
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Autenticación Polkit (Universal para Debian / Hyprland)
exec-once = hyprpolkitagent || /usr/lib/mate-polkit/polkit-mate-authentication-agent-1 || /usr/lib/polkit-kde-authentication-agent-1 || /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 || lxsession &

# Servicios esenciales
exec-once = swaync &                          # Notificaciones
exec-once = swayosd-server &                  # OSD moderno de volumen, brillo y bloqueos
exec-once = bash ~/.config/hypr/start_waybar.sh &  # Barra superior de forma dinámica
exec-once = hyprpaper &                       # Fondo de pantalla
exec-once = hypridle &                        # Gestor de inactividad
exec-once = nm-applet --indicator &           # Icono de red
exec-once = blueman-applet &                  # Icono de bluetooth

# Ajustar cursor al arrancar
exec-once = hyprctl setcursor Bibata-Modern-Ice 24

# ── 4. Configuración Estética y Comportamiento Base ───────────────────
general {
    gaps_in = 2
    gaps_out = 4
    border_size = 1
    col.active_border = rgba(ffffffff)
    col.inactive_border = rgba(1c1c1eff)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 0.95
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 30
        render_power = 4
        color = rgba(00000055)
    }

    blur {
        enabled = true
        size = 10
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
    }
}

dwindle {
    # pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vrr = 0
}

xwayland {
    force_zero_scaling = true
}

# ── 5. Variables Globales para Atajos y Scripts ───────────────────────
$mainMod = SUPER
$scrPath = ~/.config/hypr/scripts

# ── 6. Cargar Reglas, Atajos y Preferencias ───────────────────────────
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/userprefs.conf

blurls = waybar
blurls = rofi
blurls = swaync-control-center
blurls = swaync-notification-window
