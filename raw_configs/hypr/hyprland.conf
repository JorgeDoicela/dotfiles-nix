# Configuración Principal de Hyprland (Directa, Independiente y Profesional)

# ── 1. Monitores ──────────────────────────────────────────────────────
source = ~/.config/hypr/monitors.conf

# ── 2. Variables de Entorno ───────────────────────────────────────────
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_CONFIG_HOME,$HOME/.config
env = XDG_CACHE_HOME,$HOME/.cache
env = XDG_DATA_HOME,$HOME/.local/share
env = XDG_STATE_HOME,$HOME/.local/state

# Temas y toolkit backends
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt6ct
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ── 3. Autostart (Servicios de Inicio) ────────────────────────────────
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Autenticación Polkit
exec-once = /usr/lib/polkit-kde-authentication-agent-1 || /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 || lxsession &

# Servicios esenciales
exec-once = swaync &                          # Notificaciones
exec-once = hyprpaper &                       # Fondo de pantalla
exec-once = hypridle &                        # Gestor de inactividad
exec-once = nm-applet --indicator &           # Icono de red
exec-once = blueman-applet &                  # Icono de bluetooth

# Ajustar cursor al arrancar
exec-once = hyprctl setcursor Bibata-Modern-Ice 24

# ── 4. Configuración Estética y Comportamiento Base ───────────────────
general {
    gaps_in = 5
    gaps_out = 12
    border_size = 1
    col.active_border = rgba(ffffffff)
    col.inactive_border = rgba(1c1c1eff)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.90
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 25
        render_power = 4
        color = rgba(00000045)
    }

    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
        special = true
    }
}

dwindle {
    # pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}



misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vrr = 0
}

xwayland {
    force_zero_scaling = true
}

# ── 5. Variables Globales para Atajos y Scripts ───────────────────────
$mainMod = SUPER
$scrPath = ~/.config/hypr/scripts

# ── 6. Cargar Reglas, Atajos y Preferencias ───────────────────────────
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/userprefs.conf

# ── 7. Reglas de Capa estilo macOS (Vidrio Esmerilado / Frosted Glass) ──
blurls = waybar
blurls = nwg-dock
