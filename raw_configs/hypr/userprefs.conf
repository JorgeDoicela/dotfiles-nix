# Configuración personal de Hyprland

# ── Teclado e input ──────────────────────────────────────────────────
input {
    kb_layout          = latam
    sensitivity        = 0.4
    scroll_factor      = 0.35
    numlock_by_default = true
    repeat_rate        = 45
    repeat_delay       = 250

    touchpad {
        natural_scroll = no
        scroll_factor  = 0.35
    }
}

# ── Gestos ───────────────────────────────────────────────────────────
gestures {
#   workspace_swipe         = true
#   workspace_swipe_fingers = 3
}

# ── Misc ─────────────────────────────────────────────────────────────
misc {
    disable_watchdog_warning = true
}

# ── Entorno ──────────────────────────────────────────────────────────
env = WLOGOUT_STYLE,1
env = XDG_DATA_DIRS,$HOME/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share

# ── Autostart ────────────────────────────────────────────────────────
exec-once = bash -c 'h=$(date +%H%M); if [[ $h -ge 1830 || $h -lt 0145 ]]; then killall hyprsunset 2>/dev/null; hyprsunset -t 3500 -g 90; fi'

exec-once = ~/.config/hypr/start_waybar.sh
exec-once = ~/.config/hypr/start_nwg_dock.sh
# exec-once = swaync # Comentado porque ya se gestiona mediante $start.NOTIFICATIONS en variables.conf

# Portapapeles persistente (Wayland)
exec-once = wl-clip-persist --clipboard regular
exec-once = wl-paste --type text  --watch cliphist -max-items 500 store
exec-once = wl-paste --type image --watch cliphist -max-items 500 store

# ── Reglas de ventanas ───────────────────────────────────────────────
windowrule {
    name        = jorge_vlc
    match:class = ^(vlc)$
    float       = true
    center      = true
    size        = (monitor_w*0.55) (monitor_h*0.45)
}

# Reglas para Flameshot en Wayland nativo (evita capturas recortadas/pantalla en blanco o azulejado)
windowrule {
    name        = flameshot_wayland
    match:class = ^(flameshot)$
    float       = true
    move        = 0 0
    pin         = true
}



# ── Animaciones ──────────────────────────────────────────────────────
animations {
    enabled = yes
    bezier  = wind,  0.05, 0.9, 0.1, 1.05
    bezier  = winIn, 0.1,  1.1, 0.1, 1.1
    bezier  = winOut,0.3, -0.3, 0,   1
    bezier  = liner, 1,    1,   1,   1

    animation = windows,      1, 3, wind,    slide
    animation = windowsIn,    1, 3, winIn,   slide
    animation = windowsOut,   1, 3, winOut,  slide
    animation = windowsMove,  1, 3, wind,    slide
    animation = border,       0, 1, liner
    animation = borderangle,  0, 1, liner
    animation = fade,         1, 3, default
    animation = workspaces,   1, 3, wind,    slide
}

# ── Reglas para gsimplecal ───────────────────────────────────────────
windowrule {
    name        = jorge_gsimplecal
    match:class = ^(gsimplecal)$
    float       = true
    move        = 1500 65
}

# ── Rendimiento Escalonado ───────────────────────────────────────────
# Carga la configuración local de rendimiento específica de la máquina
source = ./performance.conf




