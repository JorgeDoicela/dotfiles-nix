# Configuración de rendimiento de Hyprland (performance.conf)
# Edita este archivo localmente para ajustar el rendimiento según el hardware.
#
# Tip: En máquinas de bajos recursos (ej. Pentium, 4GB RAM), establece:
#   blur/enabled = false, drop_shadow = false, y animations/enabled = false

decoration {
    blur {
        enabled = true
        size = 8
        passes = 2
    }
    shadow {
        enabled = true
    }
}

animations {
    enabled = yes
}
