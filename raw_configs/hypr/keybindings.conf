$personal=Personal
$d=[$personal|Sistema]
bindd = $mainMod Shift, N, $d alternar filtro de luz azul,        exec, ~/.config/hypr/toggle_sunset.sh
bindd = Control Alt,    T, $d abrir terminal,                     exec, $TERMINAL
bindd = $mainMod,       D, $d dictado por voz (VOXD Whisper),     exec, /home/jorge/.local/bin/voxd-toggle
bindd = $mainMod,       L, $d buscar libro de estudio,            exec, /home/jorge/.local/bin/selector-libros.sh

$d=[$personal|GPU]
bindd = $mainMod Control Alt, G, $d modo rendimiento GPU,         exec, pkexec /home/jorge/.local/bin/gpu-performance && notify-send "GPU" "Modo Rendimiento Activado" -i dialog-information
bindd = $mainMod Control Alt, P, $d modo ahorro GPU,              exec, pkexec /home/jorge/.local/bin/gpu-powersave && notify-send "GPU" "Modo Ahorro Activado" -i dialog-information

$mosaico=Mosaico
$d=[$personal|$mosaico]
bindd = $mainMod Alt, 1, $d mosaico mitad izquierda,   exec, ~/.local/bin/hypr-window-mosaic.sh left
bindd = $mainMod Alt, 2, $d mosaico mitad derecha,     exec, ~/.local/bin/hypr-window-mosaic.sh right
bindd = $mainMod Alt, 3, $d mosaico mitad superior,    exec, ~/.local/bin/hypr-window-mosaic.sh top
bindd = $mainMod Alt, 4, $d mosaico mitad inferior,    exec, ~/.local/bin/hypr-window-mosaic.sh bottom
bindd = $mainMod Alt, 5, $d mosaico esquina inferior,  exec, ~/.local/bin/hypr-window-mosaic.sh br
bindd = $mainMod Alt, 0, $d mosaico centro,            exec, ~/.local/bin/hypr-window-mosaic.sh center
bindd = $mainMod Alt, T, $d alternar mosaico tiling,   exec, ~/.local/bin/hypr-window-mosaic.sh tile

$float=Ventanas flotantes
$d=[$personal|$float]
bindd = $mainMod Alt, Left,  $d mover ventana flotante izquierda,  moveactive, -80 0
bindd = $mainMod Alt, Right, $d mover ventana flotante derecha,    moveactive,  80 0
bindd = $mainMod Alt, Up,    $d mover ventana flotante arriba,     moveactive,   0 -80
bindd = $mainMod Alt, Down,  $d mover ventana flotante abajo,      moveactive,   0  80

$rotate=Rotación de pantalla
$d=[$personal|$rotate]
bindd = ALT, R,  $d alternar rotación de pantalla (Alt Izq),  exec, ~/.local/bin/hypr-rotate toggle
bindd = MOD5, R, $d alternar rotación de pantalla (AltGr),    exec, ~/.local/bin/hypr-rotate toggle

$d=#! unset the group name
