# see https://wiki.hypr.land/configuring/keywords/ for more
# example binds, see https://wiki.hypr.land/configuring/binds/ for more

#? ------- KEYBINDS_HYPRLAND_V_0_53 COMPATIBLE ----------------
#   This Config is compatible with keybinding changes in Hyprland v0.53+
#   To ensure your system is working we will not disable this block


#? ------- Grouping of binds for easier management ----------------
#  $d=[Group Name|Subgroup Name1|Subgroup Name2|...]
# '$d' is a variable that is used to group binds together (or use another variable)
# This is only for organization purposes and is not a defined hyprland variable
# What we did here is to modify the Description of the binds to include the group name
# The $d will be parsed as a separate key to be use for a GUI or something pretty
# [Main|Subgroup1|Subgroup2|...]
# Main - The main groupname
# Subgroup1.. - The subgroup names can be use to avoid repeating the same description

#? ------- Variables ----------------
# Default if commented out
# $mainMod = Super # super / meta / windows key
# Assign apps
$TERMINAL = alacritty
$EDITOR = antigravity
$EXPLORER = thunar
$BROWSER = brave-browser

$wm=Gestión de ventanas
$d=[$wm]
bindd = $mainMod, Q, $d cerrar ventana activa, killactive
bindd = $mainMod, Delete, $d cerrar sesión de Hyprland, exit
bindd = $mainMod Shift, Space, $d alternar flotante, togglefloating
bindd = $mainMod, G, $d alternar grupo, togglegroup
bindd = $mainMod, F, $d alternar pantalla completa, fullscreen
bindd = $mainMod Shift, L, $d bloquear pantalla, exec, hyprlock
bindd = $mainMod Shift, F, $d fijar ventana activa, pin
bindd = Control Alt, Delete, $d menú de sesión, exec, $scrPath/logoutlaunch.sh

$d=[$wm|Navegación de grupos]
bindd = $mainMod Control, H, $d grupo activo anterior   , changegroupactive, b
bindd = $mainMod Control, L, $d grupo activo siguiente  , changegroupactive, f

$d=[$wm|Cambiar foco]
bindd = $mainMod, Left, $d enfocar izquierda, movefocus, l
bindd = $mainMod, Right, $d enfocar derecha , movefocus, r
bindd = $mainMod, Up, $d enfocar arriba , movefocus, u
bindd = $mainMod, Down , $d enfocar abajo, movefocus, d
bindd = ALT, Tab,$d ciclar foco, exec, hyprctl --batch "dispatch cyclenext ; dispatch alterzorder top"

$d=[$wm|Redimensionar ventana activa]
# Resize windows
bindde = $mainMod Shift, Right, $d redimensionar ventana a la derecha , resizeactive, 30 0
bindde = $mainMod Shift, Left, $d redimensionar ventana a la izquierda, resizeactive, -30 0
bindde = $mainMod Shift, Up, $d redimensionar ventana arriba, resizeactive, 0 -30
bindde = $mainMod Shift, Down, $d redimensionar ventana abajo, resizeactive, 0 30

# Move active window around current workspace with mainMod + Shift + Control [←→↑↓]
$d=[$wm|Mover ventana en el espacio]
$moveactivewindow=grep -q "true" <<< $(hyprctl activewindow -j | jq -r .floating) && hyprctl dispatch moveactive
bindde = $mainMod Shift Control, left, mover ventana activa a la izquierda, exec, $moveactivewindow -30 0 || hyprctl dispatch movewindow l
bindde = $mainMod Shift Control, right, mover ventana activa a la derecha, exec, $moveactivewindow 30 0 || hyprctl dispatch movewindow r
bindde = $mainMod Shift Control, up, mover ventana activa arriba, exec, $moveactivewindow  0 -30 || hyprctl dispatch movewindow u
bindde = $mainMod Shift Control, down, mover ventana activa abajo, exec, $moveactivewindow 0 30 || hyprctl dispatch movewindow d

# Move/Resize focused window
$d=[$wm|Mover y redimensionar con ratón]
binddm = $mainMod, mouse:272, $d mantener para mover ventana, movewindow
binddm = $mainMod, mouse:273, $d mantener para redimensionar ventana, resizewindow
binddm = $mainMod, Z, $d mantener para mover ventana , movewindow
binddm = $mainMod, X, $d mantener para redimensionar ventana, resizewindow

# Toggle focused window split
$d=[$wm]
bindd = $mainMod, J, $d alternar división, layoutmsg, togglesplit

$l=Lanzador
$d=[$l|Aplicaciones]
bindd = $mainMod, Return, $d emulador de terminal , exec, $TERMINAL
bindd = $mainMod, E, $d explorador de archivos , exec, $TERMINAL -e yazi
bindd = $mainMod, C, $d editor de texto , exec, $EDITOR
bindd = $mainMod, B, $d navegador web , exec, $BROWSER
bindd = Control Shift, Escape, $d monitor del sistema , exec, $TERMINAL -e btop

$d=[$l|Menús Rofi]
bindd = $mainMod, Space, $d buscador de aplicaciones , exec, pkill -x rofi || rofi -show drun
bindd = $mainMod, Tab, $d selector de ventanas , exec, pkill -x rofi || rofi -show window
bindd = $mainMod Shift, E, $d explorador de archivos , exec, $EXPLORER
bindd = $mainMod, H, $d ayuda de atajos, exec, pkill -x rofi || $scrPath/keybinds_hint.sh c # launch keybinds hint
bindd = $mainMod, comma, $d selector de emojis , exec, pkill -x rofi || $scrPath/emoji-picker.sh # launch emoji picker
bindd = $mainMod, period, $d selector de glifos , exec, pkill -x rofi || $scrPath/glyph-picker.sh # launch glyph picker

bindd = $mainMod, V, $d portapapeles,  exec, pkill -x rofi || $scrPath/cliphist-rofi.sh
bindd = $mainMod Shift, V, $d limpiar historial de portapapeles , exec, $scrPath/cliphist-rofi.sh -c
# bindd = $mainMod Shift, A, $d elegir lanzador Rofi , exec, pkill -x rofi || $scrPath/rofiselect.sh # launch select menu


$hc=Control de hardware
$d=[$hc|Audio]
# binddl  = , F10, $d alternar silencio de salida , exec, $scrPath/volumecontrol.sh -o m # toggle audio mute
binddl  = , XF86AudioMute,$d alternar silencio de salida, exec, $scrPath/volumecontrol.sh -o m # toggle audio mute
# binddel = , F11, $d bajar volumen , exec, $scrPath/volumecontrol.sh -o d # decrease volume
# binddel = , F12, $d subir volumen , exec, $scrPath/volumecontrol.sh -o i # increase volume
binddl  = , XF86AudioMicMute,$d silenciar/activar micrófono  , exec, $scrPath/volumecontrol.sh -i m # toggle microphone mute
binddel = , XF86AudioLowerVolume, $d bajar volumen , exec, $scrPath/volumecontrol.sh -o d # decrease volume
binddel = , XF86AudioRaiseVolume, $d subir volumen , exec, $scrPath/volumecontrol.sh -o i # increase volume

$d=[$hc|Medios]
binddl  = , XF86AudioPlay,$d reproducir medios, exec, playerctl play-pause # toggle between media play and pause
binddl  = , XF86AudioPause,$d pausar medios, exec, playerctl play-pause # toggle between media play and pause
binddl  = , XF86AudioNext,$d siguiente pista  , exec, playerctl next # media next
binddl  = , XF86AudioPrev,$d pista anterior , exec, playerctl previous # media previous
bindd = $mainMod Control, M, $d silenciar ventana activa, exec, python3 $scrPath/window.mute.py # toggle mute for active window


$d=[$hc|Brillo]
binddel = , XF86MonBrightnessUp, $d subir brillo , exec, $scrPath/brightnesscontrol.sh i # increase brightness
binddel = , XF86MonBrightnessDown, $d bajar brillo , exec, $scrPath/brightnesscontrol.sh d # decrease brightness


$ut=Utilidades
$d=[$ut]
bindd = $mainMod Shift, B, $d alternar barra superior , exec, pkill -USR1 waybar
binddl = $mainMod, K, $d alternar distribución de teclado , exec, $scrPath/keyboardswitch.sh # switch keyboard layout

$d=[$ut|Capturas de pantalla]
bindd = $mainMod Shift, P, $d selector de color, exec, hyprpicker -an # Pick color (Hex) >> clipboard#
bindd = , Print, $d captura de pantalla interactiva , exec, ~/.local/bin/flameshot-hypr gui # interactive screenshot capture
bindd = Shift, Print, $d captura parcial , exec, ~/.local/bin/flameshot-hypr gui # partial screenshot capture
binddl = $mainMod, Print, $d capturar monitor , exec, ~/.local/bin/flameshot-hypr screen -n 0 -c # monitor screenshot capture
binddl = $mainMod Shift, Print, $d capturar todos los monitores , exec, ~/.local/bin/flameshot-hypr full -c # all monitors screenshot capture

# TODO Make a main rofi menu for these selectors
$rice=Tema y fondo
$d=[$rice]
# bindd = $mainMod Shift Alt, Right, $d fondo global siguiente , exec, $scrPath/wallpaper.sh -Gn # next global wallpaper
# bindd = $mainMod Shift Alt, Left, $d fondo global anterior , exec, $scrPath/wallpaper.sh -Gp # previous global wallpaper
# bindd = $mainMod Shift, W, $d elegir fondo global , exec, pkill -x rofi || $scrPath/wallpaper.sh -SG # launch wallpaper select menu
# bindd = $mainMod Shift, R, $d selector de modo wallbash , exec, pkill -x rofi || $scrPath/wallbashtoggle.sh -m # launch wallbash mode select menu
# bindd = $mainMod Shift, T, $d elegir tema, exec, pkill -x rofi || $scrPath/themeselect.sh # launch theme select menu
# bindd = $mainMod+Shift, Y, $d elegir animaciones, exec, pkill -x rofi || $scrPath/animations.sh --select # launch animations select menu
# bindd = $mainMod+Shift, U, $d elegir diseño de hyprlock, exec, pkill -x rofi || $scrPath/hyprlock.sh --select # launch hyprlock layout select menu



$ws=Espacios de trabajo
$d=[$ws|Navegación]
bindd = $mainMod, 1, $d ir al espacio 1 , workspace, 1
bindd = $mainMod, 2, $d ir al espacio 2 , workspace, 2
bindd = $mainMod, 3, $d ir al espacio 3 , workspace, 3
bindd = $mainMod, 4, $d ir al espacio 4 , workspace, 4
bindd = $mainMod, 5, $d ir al espacio 5 , workspace, 5
bindd = $mainMod, 6, $d ir al espacio 6 , workspace, 6
bindd = $mainMod, 7, $d ir al espacio 7 , workspace, 7
bindd = $mainMod, 8, $d ir al espacio 8 , workspace, 8
bindd = $mainMod, 9, $d ir al espacio 9 , workspace, 9
bindd = $mainMod, 0, $d ir al espacio 10 , workspace, 10

$d=[$ws|Navegación|Espacio relativo]
bindd = $mainMod Control, Right, $d espacio siguiente  , workspace, r+1
bindd = $mainMod Control, Left, $d espacio anterior , workspace, r-1

$d=[$ws|Navegación]
bindd = $mainMod Control, Down, $d ir al espacio vacío más cercano , workspace, empty

# Move focused window to a workspace
$d=[$ws|Mover ventana al espacio]
bindd = $mainMod Shift, 1, $d mover al espacio 1 , movetoworkspace, 1
bindd = $mainMod Shift, 2, $d mover al espacio 2 , movetoworkspace, 2
bindd = $mainMod Shift, 3, $d mover al espacio 3 , movetoworkspace, 3
bindd = $mainMod Shift, 4, $d mover al espacio 4 , movetoworkspace, 4
bindd = $mainMod Shift, 5, $d mover al espacio 5 , movetoworkspace, 5
bindd = $mainMod Shift, 6, $d mover al espacio 6 , movetoworkspace, 6
bindd = $mainMod Shift, 7, $d mover al espacio 7 , movetoworkspace, 7
bindd = $mainMod Shift, 8, $d mover al espacio 8 , movetoworkspace, 8
bindd = $mainMod Shift, 9, $d mover al espacio 9 , movetoworkspace, 9
bindd = $mainMod Shift, 0, $d mover al espacio 10 , movetoworkspace, 10

# Move focused window to a relative workspace
$d=[$ws]
bindd = $mainMod Control+Alt, Right, $d mover ventana al espacio siguiente , movetoworkspace, r+1
bindd = $mainMod Control+Alt, Left, $d mover ventana al espacio anterior , movetoworkspace, r-1


# Scroll through existing workspaces
$d=[$ws|Navegación]
bindd = $mainMod, mouse_down, $d espacio siguiente, workspace, e+1
bindd = $mainMod, mouse_up, $d espacio anterior, workspace, e-1


# Move/Switch to special workspace (scratchpad)
$d=[$ws|Navegación|Espacio especial]
bindd = $mainMod Shift, S, $d mover al scratchpad, movetoworkspace, special
bindd = $mainMod Alt, S, $d mover al scratchpad (silencioso) , movetoworkspacesilent, special
bindd = $mainMod, S, $d alternar scratchpad ,  togglespecialworkspace

# Move focused window to a workspace silently
$d=[$ws|Navegación|Mover ventana en silencio]
bindd = $mainMod Control, 1, $d mover al espacio 1  (silent), movetoworkspacesilent, 1
bindd = $mainMod Control, 2, $d mover al espacio 2  (silent), movetoworkspacesilent, 2
bindd = $mainMod Control, 3, $d mover al espacio 3  (silent), movetoworkspacesilent, 3
bindd = $mainMod Control, 4, $d mover al espacio 4  (silent), movetoworkspacesilent, 4
bindd = $mainMod Control, 5, $d mover al espacio 5  (silent), movetoworkspacesilent, 5
bindd = $mainMod Control, 6, $d mover al espacio 6  (silent), movetoworkspacesilent, 6
bindd = $mainMod Control, 7, $d mover al espacio 7  (silent), movetoworkspacesilent, 7
bindd = $mainMod Control, 8, $d mover al espacio 8  (silent), movetoworkspacesilent, 8
bindd = $mainMod Control, 9, $d mover al espacio 9  (silent), movetoworkspacesilent, 9
bindd = $mainMod Control, 0, $d mover al espacio 10 (silent), movetoworkspacesilent, 10
# // █▀█ █▀▀ █▀█ █▀ █▀█ █▄░█ ▄▀█ █░░
