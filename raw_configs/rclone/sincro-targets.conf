# ==============================================================================
# DEFINICION DECLARATIVA DE TARGETS PARA EL GESTOR SINCRO (GOOGLE DRIVE)
# ==============================================================================
# Formato por linea: ALIAS|REMOTO_DRIVE|RUTA_LOCAL
#
# Reglas:
# 1. El ALIAS debe ser unico y sin espacios (ej: obsidian, libros, backup).
# 2. El REMOTO_DRIVE debe comenzar con el nombre de tu remoto rclone (ej: gdrive:).
# 3. La RUTA_LOCAL puede usar variables de entorno como $HOME.
# ==============================================================================

# 1. Boveda de Obsidian (Notas personales y de estudio)
obsidian|gdrive:Documents/Vida de Jorge|$HOME/Documentos/Vida de Jorge

# 2. Meditaciones y Textos Expositivos
meditaciones|gdrive:Documents/Meditaciones sobre los Evangelios Juan|$HOME/Documentos/Meditaciones sobre los Evangelios Juan

# 3. Ejemplos de targets modulares (agrega o descomenta los que requieras):
# libros|gdrive:Documents/Libros|$HOME/Documentos/Libros
# proyectos|gdrive:Workspace/Dev|$HOME/Proyectos
# respaldos|gdrive:Backups/Laptops|$HOME/Respaldos
