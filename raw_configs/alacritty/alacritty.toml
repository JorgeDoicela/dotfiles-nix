[general]
live_config_reload = true  # Recarga la config sin reiniciar Alacritty

[scrolling]
history = 10000   # Líneas de scroll back disponibles
multiplier = 3    # Velocidad de scroll

[window]
padding = { x = 12, y = 12 }
dynamic_title = true # El título cambia según lo que hagas
opacity = 0.80 # Transparencia
blur = true

[font]
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
bold   = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }
size = 11.0

[colors.primary]
background = "#1a1b26" # Un azul muy oscuro tipo "Tokyo Night"
foreground = "#a9b1d6"

[colors.normal]
black = "#32344a"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#ad8ee6"
cyan = "#449dab"
white = "#787c99"

[colors.bright]
black = "#444b6a"
red = "#ff757f"
green = "#c3e88d"
yellow = "#ffc777"
blue = "#82a1ff"
magenta = "#c099ff"
cyan = "#86e1fc"
white = "#acb0d0"

[colors.selection]
background = "#2e3c64"
foreground = "#a9b1d6"

[colors.cursor]
cursor = "#c0caf5"
text = "#1a1b26"

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[cursor]
style = { shape = "Beam", blinking = "On" } # Una barra vertical que parpadea
vi_mode_style = { shape = "Block" } # Bloque cuando estés en modo VI

