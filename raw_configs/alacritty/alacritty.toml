[general]
live_config_reload = true

[scrolling]
history = 10000
multiplier = 3

[window]
padding = { x = 14, y = 14 }
dynamic_title = true
opacity = 0.98
blur = true

[font]
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
bold   = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }
size = 11.0

[colors.primary]
background = "#000000"
foreground = "#f5f5f7"

[colors.normal]
black   = "#2c2c2e"
red     = "#ff453a"
green   = "#30d158"
yellow  = "#ff9f0a"
blue    = "#ffffff"
magenta = "#e5e5ea"
cyan    = "#8e8e93"
white   = "#e5e5ea"

[colors.bright]
black   = "#3a3a3c"
red     = "#ff6961"
green   = "#32d74b"
yellow  = "#ffd60a"
blue    = "#ffffff"
magenta = "#ffffff"
cyan    = "#ffffff"
white   = "#ffffff"

[colors.selection]
background = "#ffffff"
foreground = "#000000"

[colors.cursor]
cursor = "#ffffff"
text   = "#000000"

[cursor]
style = { shape = "Beam", blinking = "On" }
vi_mode_style = { shape = "Block" }
