[general]
live_config_reload = true

[scrolling]
history = 10000
multiplier = 3

[window]
padding = { x = 14, y = 14 }
dynamic_title = true
opacity = 0.90
blur = true

[font]
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
bold   = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }
size = 11.0

[colors.primary]
background = "#0d0d0f"
foreground = "#f5f5f7"

[colors.normal]
black   = "#2c2c2e"
red     = "#ff453a"
green   = "#30d158"
yellow  = "#ff9f0a"
blue    = "#0a84ff"
magenta = "#bf5af2"
cyan    = "#5e5ce6"
white   = "#e5e5ea"

[colors.bright]
black   = "#3a3a3c"
red     = "#ff6961"
green   = "#32d74b"
yellow  = "#ffd60a"
blue    = "#409cff"
magenta = "#c644fc"
cyan    = "#64d2ff"
white   = "#ffffff"

[colors.selection]
background = "#0a84ff"
foreground = "#ffffff"

[colors.cursor]
cursor = "#0a84ff"
text   = "#0d0d0f"

[cursor]
style = { shape = "Beam", blinking = "On" }
vi_mode_style = { shape = "Block" }
