[manager]
ratio = [ 1, 3, 4 ] # Da más espacio a la previsualización de código
show_hidden = true
show_symlink = true
sort_by = "mtime"
mouse_events = [ "click", "scroll" ]
sort_reverse = true
scrolloff = 5


[opener]
edit = [
	{ run = 'nvim "$@"', block = true, desc = "Abrir con Neovim" },
]

[preview]
max_width = 600
max_height = 900
image_filter = "triangle" # Filtro ligero para tu Pentium G2020
